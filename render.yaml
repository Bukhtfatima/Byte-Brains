services:
  # FastAPI Backend Service (Free Tier)
  - type: web
    name: bloodbridge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        value: sqlite:///./bloodbridge.db
      - key: JWT_SECRET
        generateValue: true
      - key: AUTOMATION_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: '["*"]'
